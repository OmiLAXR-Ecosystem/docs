# Collects the docs of all packages and deploys the site to GitHub Pages (docs.omilaxr.dev)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Sent by the docs workflow of a package when its main branch changes
  repository_dispatch:
    types: [package-updated]
  # Nightly rebuild, in case a dispatch was missed
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The docs exporter. MCP_READ_TOKEN (read access to OmiLAXR.MCP) is only needed while that repo is private.
      - uses: actions/checkout@v5
        with:
          repository: OmiLAXR-Ecosystem/OmiLAXR.MCP
          token: ${{ secrets.MCP_READ_TOKEN || github.token }}
          path: .packages/OmiLAXR.MCP
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/packages.mjs
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
